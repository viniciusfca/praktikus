app = 'praktikus-frontend'
primary_region = 'gru'

[env]
  BACKEND_HOST = 'praktikus-backend.internal'

[http_service]
  internal_port = 80
  force_https = true
  auto_start_machines = true
  auto_stop_machines = 'stop'
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
