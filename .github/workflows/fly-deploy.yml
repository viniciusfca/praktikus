name: Deploy Praktikus no Fly.io ao criar uma tag

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    concurrency:
      group: fly-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy backend
        run: flyctl deploy --remote-only --config apps/backend/fly.toml --dockerfile apps/backend/Dockerfile .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    name: Deploy frontend
    needs: deploy-backend
    runs-on: ubuntu-latest
    concurrency:
      group: fly-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy frontend
        run: flyctl deploy --remote-only --config apps/frontend/fly.toml --dockerfile apps/frontend/Dockerfile .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
